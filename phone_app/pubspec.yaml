name: wake_alarm_sync
description: "Wake alarm phone-side sync app — sets the phone alarm and syncs the time to the PC via the shared crdt_sync transport."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  android_intent_plus: 6.1.0
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.12.1
      path: crdt_sync_dart
  cupertino_icons: 2.0.0

  # Shared JSON export/import plumbing (Save-as, picker, envelope).
  data_transfer_flutter:
    git:
      url: https://github.com/kuhyx/utils
      ref: data_transfer_flutter-v0.2.2
      path: data_transfer_flutter
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0

  # One-tap sign-in for the sync account. App-side only: crdt_sync stays pure
  # Dart so it keeps working on Linux desktop and headless.
  github_device_auth:
    git:
      url: https://github.com/kuhyx/utils
      ref: github_device_auth-v0.4.0
      path: github_device_auth
  google_account_token:
    git:
      url: https://github.com/kuhyx/utils
      ref: google_account_token-v0.1.0
      path: google_account_token
  http: 1.6.0
  path: 1.9.1
  path_provider: 2.1.6
  shared_preferences: 2.5.6

  # Shared "Sync settings" screen (Firebase + optional local backup), reused
  # across every kuhy app that syncs. GitHub mirror stays app-local (see
  # lib/screens/github_mirror_screen.dart).
  sync_settings_ui:
    git:
      url: https://github.com/kuhyx/utils
      ref: sync_settings_ui-v0.7.0
      path: sync_settings_ui
  url_launcher: 6.3.3
  uuid: 4.6.0

dev_dependencies:
  # Generates the Android launcher icons from assets/icon/ (see
  # python_pkg/app_icons in testsAndMisc for the shared style).
  flutter_launcher_icons: 0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

# Launcher icon generation. Source art is produced by the shared generator:
#   PYTHONPATH=~/src/testsAndMisc python3 -m python_pkg.app_icons generate --app <key>
# then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
